<!DOCTYPE html>
<html>
<head>
<title>Home</title>
<style>
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 80vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-size: cover;
    background-attachment: fixed;
    overflow-x: hidden;
    background-size: 300% 300%;
      background-image: linear-gradient(-45deg, 
      rgba(50, 210, 50, 1) 0%,
       rgb(26, 130, 0) 25%,
        rgba(000, 68, 183, 1) 51%,
         rgb(40, 1, 40) 100%);
      background-size: 200% 200%;
      background-size: 300% 300%;
      animation: AnimateBG 10s ease infinite;
      font-family: sans-serif, Microsoft YaHei, Cambria, Verdana, "Georgia", Arial;
    }
    @keyframes AnimateBG {
      0% {
        background-position: 0% 50%
      }
    
      50% {
        background-position: 100% 50%
      }
    
      100% {
        background-position: 0% 50%
      }
    } 
    header {
              background-color: transparent;
              color: white;
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding: 10px 20px;
              width: 100vw;
              position: sticky;
              top: 0;
              transition: background-color 1s ease;
          }
          #logo {
              font-size: 2vh;
              display: flex;
              align-items: center;
              margin-right: 3vw;
          }
  
          #logo img {
              width: auto;
              max-height: 5vh;
              cursor: pointer;
              margin-right: 3vw;
              margin-left: 3vw;
              transition: margin-right 1s ease;
          }
  
          #logo a {
              text-decoration: none;
              color: inherit;
          }
  
          nav {
              display: flex;
              margin-left: auto;
          }
  
          nav a {
              text-decoration: none;
              color: white;
              margin: 0 15px;
            
              border-radius: 5px;
              transition: background-color 0.3s;
          }
  
          nav a:hover {
              background-color: rgba(255, 255, 255, 0.1);
          }
  
          /* Change the header background color when scrolled down */
          header.scrolled {
              background-color: black;
          }
  
          /* Media query for smaller screens (tablets and below) */
          @media (max-width: 760px) {
              #logo {
                  margin-right: auto;
                  text-align: center;
              }
  
              #logo img {
                  margin-right: 3vw;
                  margin-left: 5vw;
              }
  
              nav {
                  display: none;
              }
            }
              @media (min-width: 761px) {
    #site-header a {
        display: none;
    }
}

              /* Slide-out site header */
              #site-header {
    position: fixed;
    top: 0;
    left: -250px;
    width: 250px;
    height: 100%;
    background-color: #333;
    z-index: 3;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: center; /* Center vertically */
    align-items: center; /* Center horizontally */
    transition: left 0.5s ease;
}

  
              #site-header.open {
                  left: 0;
              }
  
              #site-header a {
                  display: block;
                 
                  color: white;
                  text-decoration: none;
                  text-align: center;
              }
          
      </style>
   
   <script>
    window.addEventListener("scroll", function () {
        const header = document.querySelector("header");
        header.classList.toggle("scrolled", window.scrollY > 0);
    });

    // JavaScript to toggle the site header
    function toggleSiteHeader() {
        const siteHeader = document.getElementById("site-header");
        siteHeader.classList.toggle("open");

        const header = document.querySelector("header");
        header.classList.toggle("open");

        const mainNav = document.querySelector("#main-nav");

        if (siteHeader.classList.contains("open")) {
            mainNav.style.display = "none";
            // Hide the text within <a> elements in #main-nav
            const navLinks = document.querySelectorAll("#main-nav a");
            navLinks.forEach(function (link) {
                link.style.opacity = 0;
            });
        } else {
            // Check the screen size before showing main-nav
            if (window.innerWidth > 760) {
                mainNav.style.display = "flex";
                // Show the text within <a> elements in #main-nav
                const navLinks = document.querySelectorAll("#main-nav a");
                navLinks.forEach(function (link) {
                    link.style.opacity = 1;
                });
            }
            // Hide the text within <a> elements in #site-header
            const siteHeaderLinks = document.querySelectorAll("#site-header a");
            siteHeaderLinks.forEach(function (link) {
                link.style.opacity = 0;
            });
        }
    }

    // JavaScript to close the site header when clicking a tab or outside of it
    document.addEventListener("click", function (event) {
        const siteHeader = document.getElementById("site-header");
        const header = document.querySelector("header");
        const mainNav = document.querySelector("#main-nav");

        if (siteHeader.classList.contains("open")) {
            if (!event.target.closest("#site-header") && !event.target.closest("#logo")) {
                siteHeader.classList.remove("open");
                header.classList.remove("open");
                // Check the screen size before showing main-nav
                if (window.innerWidth > 760) {
                    mainNav.style.display = "flex";
                    // Show the text within <a> elements in #main-nav
                    const navLinks = document.querySelectorAll("#main-nav a");
                    navLinks.forEach(function (link) {
                        link.style.opacity = 1;
                    });
                }
            }
        }
    });


      const widgetToggle = document.querySelector('.widget-toggle');
            const social = document.querySelector('.social');
          
            widgetToggle.addEventListener('click', function() {
              social.classList.toggle('active');
            });
</script>





  </head>
  <body>
      <header>
          <div id="logo">
              <img src="../img/CAD-Logo.png" alt="CAD Logo" onclick="toggleSiteHeader()">
              <a href="home.html">SterlingCAD</a>
          </div>
          <nav id="main-nav">
            <a href="#">Tab 1</a>
            <a href="#">Tab 2</a>
            <a href="#">Tab 3</a>
            <a href="#">Tab 4</a>
            <a href="#">Tab 5</a>
        </nav>
      </header>
  
      <!-- Your website content goes here -->
  
      <!-- Site header for small screens -->
      <div id="site-header">
          <a href="#">Tab 10</a>
          <a href="#">Tab 20</a>
          <a href="#">Tab 30</a>
          <a href="#">Tab 40</a>
          <a href="#">Tab 50</a>
          <div class="widget-container">
            <div class="widget-toggle"></div>
            <div class="social">
              <a href="#" class="button-link facebook">facebook</a>
              <a href="#" class="button-link instagram">instagram</a>
              <a href="#" class="button-link linkedin">linkedin</a>
              <a href="#" class="button-link twitter">twitter</a>
            </div>
          </div>
          
   
</head>

</body>

</html>
